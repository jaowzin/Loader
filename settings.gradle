pluginManagement {
    repositories {
        maven { url "https://www.jitpack.io" }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url "https://www.jitpack.io" }
        google()
        mavenCentral()
    }
}

rootProject.name = "CarromLoader"

include ':app'
include ':Bcore'
include ':black-reflection'
include ':compiler'

project(':Bcore').projectDir = file('engine/NewBlackbox/Bcore')
project(':black-reflection').projectDir = file('engine/NewBlackbox/black-reflection')
project(':compiler').projectDir = file('engine/NewBlackbox/compiler')
